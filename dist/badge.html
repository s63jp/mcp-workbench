<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Workbench Badge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 40px; background: #0d1117; color: #fff; text-align: center; }
        .badge { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; border-radius: 20px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 3em; margin-bottom: 10px; }
        .stats { display: flex; justify-content: center; gap: 40px; margin: 30px 0; }
        .stat { text-align: center; }
        .stat-number { font-size: 2.5em; font-weight: bold; }
        .stat-label { color: #aaa; }
        .cta { background: #fff; color: #667eea; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px; }
        .cta:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="badge">
        <h1>🔧 MCP Workbench</h1>
        <p style="font-size: 1.3em; color: #ddd;">The Visual Testing Platform for MCP Servers</p>
        <div class="stats">
            <div class="stat">
                <div class="stat-number">18</div>
                <div class="stat-label">MCP Servers</div>
            </div>
            <div class="stat">
                <div class="stat-number">10</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat">
                <div class="stat-number">100%</div>
                <div class="stat-label">Free</div>
            </div>
        </div>
        <a href="https://mcp-workbench.uk" class="cta">Try MCP Workbench →</a>
        <p style="margin-top: 20px; color: #888; font-size: 0.9em;">#MCP #AI #DeveloperTools</p>
    </div>
</body>
</html>
